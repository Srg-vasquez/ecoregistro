# Blueprint: conectar el repo en Render (plan Free) → URL pública para revisores.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ecoregistro
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: DEMO_SEED
        value: "false"
      - key: DEMO_PASSWORD
        value: EcoRegistroDemo2026!
      - key: TRUST_ALL_PROXIES
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr