services:
    app:
        build: .
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            APP_NAME: EcoRegistro
            APP_ENV: local
            APP_DEBUG: "false"
            APP_URL: http://localhost:8000
            APP_KEY: ${APP_KEY:-}
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ecoregistro
            DB_USERNAME: ecoregistro
            DB_PASSWORD: ${DB_PASSWORD:-ecoregistro_local_only}
            SESSION_DRIVER: database
            CACHE_STORE: database
            DEMO_PASSWORD: ${DEMO_PASSWORD:-EcoRegistroDemo2026!}
            DEMO_SEED: "true"
        volumes:
            - app_storage:/app/storage
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
            interval: 5s
            timeout: 3s
            start_period: 15s
            retries: 24
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ecoregistro
            POSTGRES_USER: ecoregistro
            POSTGRES_PASSWORD: ${DB_PASSWORD:-ecoregistro_local_only}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ecoregistro -d ecoregistro"]
            interval: 3s
            timeout: 3s
            retries: 20
volumes:
    postgres_data:
    app_storage:
